name: Vietnamese Instagram daily

# 毎日 19:23 JST に「生成⇄評価ループ → 描画 → 音声 → commit → 投稿 → 学習ログ」を実行
on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "曜日（monday〜sunday）。空なら今日（JST）"
        required: false
      dry_run:
        description: "投稿 API を叩かない"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: vietnam-insta
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: vietnam-insta-bot
    env:
      LLM_PROVIDER: ${{ vars.VI_LLM_PROVIDER || 'gemini' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
      PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
      TTS_VOICE: ${{ vars.VI_TTS_VOICE || 'vi-VN-HoaiMyNeural' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - name: Check secrets
        id: key
        working-directory: .
        env:
          G: ${{ secrets.GEMINI_API_KEY }}
          A: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$G$A" ]; then echo "::notice::GEMINI_API_KEY が未設定のためスキップします"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.key.outputs.ok == 'true'
      - uses: actions/setup-node@v5
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        if: steps.key.outputs.ok == 'true'
        with:
          python-version: "3.12"
      - name: Install
        if: steps.key.outputs.ok == 'true'
        run: |
          npm ci --no-audit --no-fund
          pip install edge-tts
      - name: Generate, evaluate, render, speak
        if: steps.key.outputs.ok == 'true'
        id: gen
        run: |
          DATE=$(TZ=Asia/Tokyo date +%F)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          DAY_ARG=""
          if [ -n "${{ inputs.day }}" ]; then DAY_ARG="--day ${{ inputs.day }}"; fi
          node src/index.js --date "$DATE" $DAY_ARG --skip-upload
      - name: Commit images and log
        if: always() && steps.gen.outputs.date != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add output data
          git diff --cached --quiet || git commit -m "vietnam-insta: content for ${{ steps.gen.outputs.date }}"
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break; sleep $((2**i)); done
      - name: Publish to Instagram
        if: success() && env.INSTAGRAM_ACCOUNT_ID != ''
        run: |
          # Graph API は公開URLの JPEG を取りに来るので、push 済みコミットの raw URL を渡す
          export MEDIA_BASE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/$(git rev-parse HEAD)/vietnam-insta-bot/output"
          node src/index.js --upload-only --date "${{ steps.gen.outputs.date }}"
      - name: Commit publish record
        if: always() && steps.gen.outputs.date != ''
        run: |
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "vietnam-insta: publish record ${{ steps.gen.outputs.date }}"
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break; sleep $((2**i)); done
