name: Instagram autopost

on:
  schedule:
    - cron: "7 12 * * *"    # 21:07 JST — feed carousel (+ reel on reel days)
    - cron: "17 23 * * *"   # 08:17 JST — story with yesterday's quiz answer
    - cron: "37 18 * * 0"   # Mon 03:37 JST — collect insights
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        required: true
        default: check
        type: choice
        options: [check, find-id, feed, story, metrics]
      date:
        description: "YYYY-MM-DD (JST). Empty = today"
        required: false
      dry_run:
        description: "Only print what would be posted"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pick mode
        id: mode
        run: |
          case "${{ github.event.schedule }}" in
            "7 12 * * *")  echo "mode=feed" >> "$GITHUB_OUTPUT" ;;
            "17 23 * * *") echo "mode=story" >> "$GITHUB_OUTPUT" ;;
            "37 18 * * 0") echo "mode=metrics" >> "$GITHUB_OUTPUT" ;;
            *)             echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Run
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          DATE_ARG=""
          if [ -n "${{ inputs.date }}" ]; then DATE_ARG="--date ${{ inputs.date }}"; fi
          if [ "$MODE" = "metrics" ]; then node insta/metrics.js; else node insta/publish.js "$MODE" $DATE_ARG; fi
      - name: Save log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add insta/published.json insta/metrics 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Instagram: ${{ steps.mode.outputs.mode }} log"
            git pull --rebase
            git push
          fi
