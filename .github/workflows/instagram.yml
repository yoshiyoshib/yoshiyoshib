name: Instagram autopost

on:
  schedule:
    # Scheduled runs can start late, so each slot has backups; publishing is idempotent (logged in published.json).
    - cron: "7 12 * * *"    # 21:07 JST — feed carousel
    - cron: "37 12 * * *"   # 21:37 JST — feed backup
    - cron: "7 13 * * *"    # 22:07 JST — feed backup
    - cron: "17 23 * * *"   # 08:17 JST — story with yesterday's quiz answer
    - cron: "47 23 * * *"   # 08:47 JST — story backup
    - cron: "37 18 * * *"   # 03:37 JST daily — collect insights for the learning loop
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        required: true
        default: check
        type: choice
        options: [check, find-id, feed, story, metrics]
      date:
        description: "YYYY-MM-DD (JST). Empty = today"
        required: false
      dry_run:
        description: "Only print what would be posted"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Pick mode
        id: mode
        run: |
          case "${{ github.event.schedule }}" in
            "7 12 * * *"|"37 12 * * *"|"7 13 * * *") echo "mode=feed" >> "$GITHUB_OUTPUT" ;;
            "17 23 * * *"|"47 23 * * *") echo "mode=story" >> "$GITHUB_OUTPUT" ;;
            "37 18 * * *") echo "mode=metrics" >> "$GITHUB_OUTPUT" ;;
            *)             echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Run
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          DATE_ARG=""
          if [ -n "${{ inputs.date }}" ]; then DATE_ARG="--date ${{ inputs.date }}"; fi
          if [ "$MODE" = "metrics" ]; then node insta/metrics.js; else node insta/publish.js "$MODE" $DATE_ARG; fi
      - name: Save log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in insta/published.json insta/metrics; do if [ -e "$p" ]; then git add "$p"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "Instagram: ${{ steps.mode.outputs.mode }} log"
            git pull --rebase
            git push
          fi
      - name: Warn when the post stock runs low
        if: steps.mode.outputs.mode == 'story'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MISSING=$(node -e '
            const { addDays, todayJST, loadPost } = require("./insta/lib");
            const out = [1, 2].map(n => addDays(todayJST(), n)).filter(d => (loadPost(d) || {}).status !== "approved");
            console.log(out.join(" "));')
          TITLE="投稿のストックが切れそうです"
          if [ -n "$MISSING" ] && [ -z "$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$TITLE" --body "@${{ github.repository_owner }} 次の日の投稿がまだありません：$MISSING

          Claude のチャットで「投稿を作って」と送ってください。チャットが消えていたら、新しいチャットで「yoshiyoshib/yoshiyoshib の Instagram 投稿の続きをやって」と送れば再開できます（手順は .claude/skills/daily-loop/SKILL.md）。"
          fi
