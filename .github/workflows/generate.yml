name: Instagram daily content

on:
  schedule:
    - cron: "41 5 * * *"    # 14:41 JST — learn from numbers, write the next 3 days, render
  workflow_dispatch:
    inputs:
      days:
        description: "How many days ahead to fill"
        required: false
        default: "3"

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: insta
    steps:
      - name: Check for API key
        id: key
        working-directory: .
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::notice::ANTHROPIC_API_KEY is not set; Claude chat makes the posts instead."; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.key.outputs.ok == 'true'
      - uses: actions/setup-node@v5
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: 24
      - name: Install
        if: steps.key.outputs.ok == 'true'
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Write posts with Claude
        if: steps.key.outputs.ok == 'true'
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          node generate.mjs --days "${{ inputs.days || '3' }}" | tee gen.log
          echo "dates=$(grep '^WROTE ' gen.log | cut -d' ' -f2 | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: Render images
        if: always() && steps.gen.outputs.dates != ''
        run: |
          # Render each new day plus the day after it (its morning story answers the new day's quiz).
          DATES=""
          for d in ${{ steps.gen.outputs.dates }}; do
            DATES="$DATES $d $(date -u -d "$d +1 day" +%F)"
          done
          node render.js $(echo $DATES | tr ' ' '\n' | sort -u)
      - name: Save
        if: always() && steps.key.outputs.ok == 'true'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add insta/posts insta/out insta/learnings.md
          if ! git diff --cached --quiet; then
            git commit -m "Instagram: daily content ${{ steps.gen.outputs.dates }}"
            git pull --rebase
            git push
          fi
