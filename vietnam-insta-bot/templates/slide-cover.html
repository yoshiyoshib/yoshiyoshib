<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{fontsUrl}}">
<style>{{{styles}}}</style>
</head>
<body>
<div class="slide cover" style="--theme: {{themeColor}}; --accent: {{accentColor}};">
  <header class="top"><span class="brand">{{brand}}</span><span class="tag">{{dayLabel}}</span><span class="page">{{page}} / {{total}}</span></header>
  <div class="fit" data-min="56">
    <div class="badge">{{badge}}</div>
    <h1 class="title">{{title}}</h1>
    <p class="subtitle">{{subtitle}}</p>
  </div>
  <div class="swipe">スワイプして学ぶ →</div>
</div>
</body>
</html>
