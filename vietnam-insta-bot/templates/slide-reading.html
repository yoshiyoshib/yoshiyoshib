<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{fontsUrl}}">
<style>{{{styles}}}</style>
</head>
<body>
<div class="slide reading" style="--theme: {{themeColor}}; --accent: {{accentColor}};">
  <header class="top"><span class="brand">{{brand}}</span><span class="tag">{{dayLabel}}</span><span class="page">{{page}} / {{total}}</span></header>
  {{{headingHtml}}}
  <main class="fit" data-min="20">
    <span class="para-no">ĐOẠN {{paragraphNo}}</span>
    <div class="vi" lang="vi">{{{vietnameseHtml}}}</div>
    <div class="ja">{{japaneseText}}</div>
    {{{annotationHtml}}}
  </main>
  <footer class="foot"><span>本格長文読解</span><span class="save">保存して精読 ⟶</span></footer>
</div>
</body>
</html>
