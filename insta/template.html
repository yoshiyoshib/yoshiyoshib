<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily Lexicon template</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;700&family=Noto+Sans:wght@400&family=IBM+Plex+Mono:wght@500&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
  /* Layout: 1080x1350 (4:5) carousel. Cover on deep ink, one entry per slide on cool paper, recap + quiz to close. */
  :root {
    --ink: #141a33;
    --paper: #f1f3f8;
    --card: #ffffff;
    --muted: #5d6480;
    --rule: #d8dce8;
    --phrasal: #2b4be0;   /* 句動詞 */
    --idiom: #d24a14;     /* イディオム */
    --word: #0b7a5c;      /* C1–C2 単語 */
    --headword: "Young Serif", Georgia, serif;
    --en: "Figtree", "Helvetica Neue", Arial, sans-serif;
    --ipa: "Noto Sans", "Lucida Sans Unicode", sans-serif;
    --mono: "IBM Plex Mono", "Courier New", monospace;
    --ja: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #888; font-family: var(--en); color: var(--ink); }
  .slide {
    width: 1080px; height: 1350px; position: relative; overflow: hidden;
    background: var(--paper); padding: 84px 88px 0; display: flex; flex-direction: column;
    margin-bottom: 40px;
  }
  .label { font-family: var(--mono); font-size: 24px; letter-spacing: .14em; text-transform: uppercase; }
  .ja { font-family: var(--ja); }

  /* ---------- top bar & footer (shared) ---------- */
  .bar { display: flex; justify-content: space-between; align-items: center; color: var(--muted); }
  .foot {
    margin-top: auto; height: 120px; display: flex; justify-content: space-between; align-items: center;
    border-top: 2px solid var(--rule); color: var(--muted); font-size: 26px;
  }
  .foot b { color: var(--ink); font-weight: 700; }

  /* ---------- cover ---------- */
  .cover { background: var(--ink); color: #fff; }
  .cover .bar { color: #aab2d6; }
  .cover h1 {
    font-family: var(--headword); font-weight: 400; font-size: 150px; line-height: .98;
    margin: 120px 0 0; letter-spacing: -.01em;
  }
  .cover h1 em { font-style: normal; color: #8fa2ff; }
  .cover .theme { font-family: var(--ja); font-size: 44px; font-weight: 700; margin: 36px 0 0; }
  .cover .theme small { display: block; font-family: var(--en); font-weight: 500; font-size: 30px; color: #aab2d6; margin-top: 8px; }
  .cover ol { list-style: none; margin: 72px 0 0; padding: 0; display: flex; flex-direction: column; gap: 18px; }
  .cover li { display: flex; align-items: center; gap: 24px; font-size: 38px; font-weight: 500; }
  .dot { width: 18px; height: 18px; border-radius: 50%; flex: none; }
  .cover .foot { border-color: #2c3456; color: #aab2d6; }
  .cover .foot b { color: #fff; }
  .legend { display: flex; gap: 28px; font-size: 24px; }
  .legend span { display: flex; align-items: center; gap: 10px; }
  .legend .dot { width: 14px; height: 14px; }

  /* ---------- entry ---------- */
  .chip {
    display: inline-flex; align-items: center; gap: 12px; color: #fff; padding: 10px 20px 10px 18px;
    border-radius: 6px; font-family: var(--mono); font-size: 24px; letter-spacing: .14em; text-transform: uppercase;
  }
  .chip .ja { letter-spacing: 0; font-size: 24px; font-weight: 700; text-transform: none; opacity: .9; }
  .term {
    font-family: var(--headword); font-weight: 400; line-height: 1.02; margin: 56px 0 0;
    font-size: 128px; letter-spacing: -.01em;
  }
  .pron { display: flex; gap: 24px; align-items: baseline; margin-top: 22px; color: var(--muted); font-size: 32px; }
  .pron .ipa { font-family: var(--ipa); }
  .pron .pos { font-style: italic; }
  .meaning-ja { font-family: var(--ja); font-weight: 700; font-size: 58px; line-height: 1.3; margin: 44px 0 0; }
  .definition { font-size: 34px; line-height: 1.45; margin: 18px 0 0; color: #2c3350; max-width: 880px; }
  .example {
    margin-top: 48px; background: var(--card); border-radius: 18px; padding: 40px 44px;
    border-left: 10px solid var(--accent);
  }
  .example .label { color: var(--accent); font-size: 22px; }
  .example .en { font-size: 40px; line-height: 1.42; margin: 14px 0 0; font-weight: 500; }
  .example .en mark {
    background: linear-gradient(transparent 58%, var(--hl) 58%); color: inherit; padding: 0 2px; font-weight: 700;
  }
  .example .ja { font-size: 29px; line-height: 1.6; color: var(--muted); margin: 16px 0 0; }
  .note { margin-top: 32px; font-size: 29px; line-height: 1.55; color: var(--muted); display: flex; gap: 16px; }
  .note .label { color: var(--ink); font-size: 22px; padding-top: 5px; flex: none; }

  .t-phrasal { --accent: var(--phrasal); --hl: rgba(43, 75, 224, .22); }
  .t-idiom   { --accent: var(--idiom);   --hl: rgba(210, 74, 20, .22); }
  .t-word    { --accent: var(--word);    --hl: rgba(11, 122, 92, .22); }
  .chip { background: var(--accent); }

  /* ---------- recap ---------- */
  .recap h2 { font-family: var(--headword); font-weight: 400; font-size: 72px; margin: 40px 0 0; line-height: 1; }
  .recap h2 + p { font-family: var(--ja); font-size: 30px; color: var(--muted); margin: 14px 0 0; }
  .list { margin: 28px 0 0; display: flex; flex-direction: column; border-top: 2px solid var(--rule); }
  .row { display: grid; grid-template-columns: 18px 1fr; gap: 26px; align-items: baseline; padding: 14px 0; border-bottom: 2px solid var(--rule); }
  .row .dot { transform: translateY(-4px); }
  .row strong { font-size: 33px; font-weight: 700; display: block; }
  .row span { font-family: var(--ja); font-size: 26px; color: var(--muted); }
  .quiz { margin: 28px 0 24px; background: var(--ink); color: #fff; border-radius: 18px; padding: 30px 40px; }
  .quiz .label { color: #8fa2ff; font-size: 22px; }
  .quiz p { font-size: 33px; line-height: 1.4; margin: 10px 0 16px; font-weight: 500; }
  .quiz .opts { display: flex; flex-wrap: wrap; gap: 14px 34px; font-size: 30px; color: #cfd5f0; }
  .quiz .opts b { color: #8fa2ff; font-family: var(--mono); margin-right: 8px; }
  .quiz small { display: block; margin-top: 16px; font-family: var(--ja); font-size: 26px; color: #aab2d6; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const TYPE = {
  phrasal: { en: "Phrasal verb", ja: "句動詞", color: "var(--phrasal)" },
  idiom:   { en: "Idiom",        ja: "イディオム", color: "var(--idiom)" },
  word:    { en: "Word",         ja: "単語", color: "var(--word)" },
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const marked = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<mark>$1</mark>");
const pad = n => String(n).padStart(2, "0");

function render(post, cfg) {
  const items = post.items;
  const total = items.length + 2;
  const fmtDate = new Date(post.date + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  const bar = (i) => `<div class="bar label"><span>${esc(cfg.brand)} · No.${String(post.no).padStart(3, "0")}</span><span>${pad(i)} / ${pad(total)}</span></div>`;
  const foot = (left) => `<div class="foot"><b>${esc(cfg.handle)}</b><span class="ja">${left}</span></div>`;
  const chipLabel = it => it.type === "word" ? `${TYPE.word.en} · ${esc(it.level || "C1")}` : TYPE[it.type].en;

  const slides = [];
  slides.push(`<section class="slide cover">
    <div class="bar label"><span>${esc(cfg.brand)} · No.${String(post.no).padStart(3, "0")}</span><span>${esc(fmtDate)}</span></div>
    <h1>${items.length} English<br><em>expressions</em></h1>
    <p class="theme">${esc(post.theme.ja)}<small>${esc(post.theme.en)}</small></p>
    <ol>${items.map(it => `<li><i class="dot" style="background:${TYPE[it.type].color}"></i>${esc(it.term)}</li>`).join("")}</ol>
    <div class="foot"><div class="legend">${Object.values(TYPE).map(t => `<span class="ja"><i class="dot" style="background:${t.color}"></i>${t.ja}</span>`).join("")}</div><span class="ja">スワイプ →</span></div>
  </section>`);

  items.forEach((it, i) => {
    slides.push(`<section class="slide t-${it.type}">
      ${bar(i + 2)}
      <div style="margin-top:64px"><span class="chip">${chipLabel(it)}<span class="ja">${TYPE[it.type].ja}</span></span></div>
      <h2 class="term fit">${esc(it.term)}</h2>
      <div class="pron">${it.ipa ? `<span class="ipa">${esc(it.ipa)}</span>` : ""}${it.pos ? `<span class="pos">${esc(it.pos)}</span>` : ""}</div>
      <p class="meaning-ja">${esc(it.ja)}</p>
      <p class="definition">${esc(it.definition)}</p>
      <div class="example"><div class="label">Example</div><p class="en">${marked(it.example)}</p><p class="ja">${esc(it.example_ja)}</p></div>
      ${it.note ? `<div class="note"><span class="label">Tip</span><span class="ja">${esc(it.note)}</span></div>` : ""}
      ${foot(esc(cfg.cta_ja))}
    </section>`);
  });

  const q = post.quiz;
  slides.push(`<section class="slide recap">
    ${bar(total)}
    <h2>Review</h2><p>今日の${items.length}つをおさらい</p>
    <div class="list">${items.map(it => `<div class="row"><i class="dot" style="background:${TYPE[it.type].color}"></i><div><strong>${esc(it.term)}</strong><span>${esc(it.ja)}</span></div></div>`).join("")}</div>
    ${q ? `<div class="quiz"><div class="label">Quiz</div><p>${esc(q.sentence)}</p>
      <div class="opts">${q.options.map((o, k) => `<span><b>${"ABCD"[k]}</b>${esc(o)}</span>`).join("")}</div>
      <small>答えはコメントで！ 正解はキャプションの最後に</small></div>` : ""}
    ${foot("フォローして毎日ひとつ上の英語を")}
  </section>`);

  document.getElementById("root").innerHTML = slides.join("");
}

// Shrink long headwords so they stay within two lines.
function fit() {
  document.querySelectorAll(".fit").forEach(el => {
    let size = 128;
    el.style.fontSize = size + "px";
    const maxH = () => size * 1.02 * 2 + 4;
    while (size > 64 && (el.scrollHeight > maxH() || el.scrollWidth > el.clientWidth)) {
      size -= 4; el.style.fontSize = size + "px";
    }
  });
}

window.renderPost = async (post, cfg) => { render(post, cfg); await document.fonts.ready; fit(); };
</script>
</body>
</html>
